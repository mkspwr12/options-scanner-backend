name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: options-scanner-backend-2exk6s
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "tests/*" \
            -x "docs/*" \
            -x ".agentx/*" \
            -x "app-logs/*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x ".env*" \
            -x ".vscode/*" \
            -x "*.zip" \
            -x "scripts/*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable Oryx build on Azure
        run: |
          az webapp config appsettings set \
            --resource-group options-scanner-rg \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy.zip

      - name: Configure Startup Command
        run: |
          az webapp config set \
            --resource-group options-scanner-rg \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --startup-file "bash startup.sh"

      - name: Configure App Settings
        run: |
          az webapp config appsettings set \
            --resource-group options-scanner-rg \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --settings \
              SQL_CONNECTION_STRING="${{ secrets.SQL_CONNECTION_STRING }}" \
              AZURE_CLIENT_ID="${{ secrets.MI_CLIENT_ID }}" \
              APPLICATIONINSIGHTS_CONNECTION_STRING="${{ secrets.APPINSIGHTS_CONNECTION_STRING }}" \
              WEBSITES_CONTAINER_START_TIME_LIMIT="600"

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group options-scanner-rg \
            --name ${{ env.AZURE_WEBAPP_NAME }}
